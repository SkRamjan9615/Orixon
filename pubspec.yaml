name: orixon
description: "ORIXON - Standalone Cable TV Set-Top Box and Local Media Center."
publish_to: 'none'
version: 1.1.0+10

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  drift: ^2.35.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  http: ^1.6.0
  file_picker: ^13.3.2
  cross_file: ^0.3.5+5
  speech_to_text: ^7.5.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true


dependency_overrides:
  media_kit_libs_android_video: ^1.3.8
